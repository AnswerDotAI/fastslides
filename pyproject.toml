[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fastslides"
dynamic = ["version"]
description = "Turn notebooks, md or Solveit dialogs into a slide deck with one command."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Pol Alvarez", email = "pol@answer.ai"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "fastcore>=2.2.17",
  "mdhtml[hl]>=0.1.40",
  "aidialog>=0.0.34",
  "fastcdp>=0.0.18",
]

[project.urls]
Repository = "https://github.com/kafkasl/fastslides"

[project.scripts]
fastslides = "fastslides.core:main"

[tool.setuptools.dynamic]
version = {attr = "fastslides.__version__"}

[tool.setuptools.packages.find]
include = ["fastslides"]
